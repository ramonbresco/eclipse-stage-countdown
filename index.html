<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Total solar eclipse stages - 08/12/2026</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  /* ---------------- theme tokens ----------------
     Dark is the default: it is the sane choice in the field, where a bright
     screen wrecks your dark adaptation minutes before totality. */
  :root, [data-bs-theme="dark"] {
    --gold: #ffcf4d;
    --corona: #ffe9a8;
    --disc: #080a10;
    --page-bg: #05070c;
    --page-glow: rgba(255, 207, 77, .10);
    --bar-bg: rgba(6, 8, 14, .86);
    --hair: rgba(255, 255, 255, .08);
    --cd-main: #ffffff;
    --cd-dim: rgba(255, 255, 255, .62);
    --cd-label: rgba(255, 255, 255, .42);
    --strip-lbl: rgba(255, 255, 255, .7);
    --main-glow: 0 0 40px rgba(255, 207, 77, .22);
    --active-tint: rgba(255, 207, 77, .09);
    --active-ring: rgba(255, 207, 77, .35);
    --dim-op: .3;
    --map-bg: #10141c;
    --pin-ring: #ffffff;
  }
  [data-bs-theme="light"] {
    --gold: #b96f00;          /* #ffcf4d has no contrast on a pale ground */
    --corona: #8a6a24;
    --disc: #1b1f26;
    --page-bg: #f7f5f0;
    --page-glow: rgba(185, 111, 0, .12);
    --bar-bg: rgba(255, 255, 255, .88);
    --hair: rgba(0, 0, 0, .12);
    --cd-main: #14181f;
    --cd-dim: rgba(20, 24, 31, .66);
    --cd-label: rgba(20, 24, 31, .5);
    --strip-lbl: rgba(20, 24, 31, .75);
    --main-glow: none;
    --active-tint: rgba(185, 111, 0, .13);
    --active-ring: rgba(185, 111, 0, .45);
    --dim-op: .42;
    --map-bg: #e8e6e0;
    --pin-ring: #14181f;
  }

  html { -webkit-text-size-adjust: 100%; }
  body {
    background:
      radial-gradient(900px 600px at 50% -12%, var(--page-glow), transparent 65%),
      var(--page-bg);
    background-attachment: fixed;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .page {
    width: 100%;
    max-width: 1200px;
    margin-inline: auto;
    padding-inline: clamp(.4rem, 2vw, 1.25rem);
  }

  /* ---- header: 1fr auto 1fr keeps the title on the true centre line ---- */
  .page-head {
    padding-block: 1.1rem .75rem;      /* room for the three-line spot button */
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: .75rem clamp(1.25rem, 5vw, 3.5rem);
  }
  #pageTitle { grid-column: 2; min-width: 0; text-wrap: balance; }
  /* stretch, so the button inherits the select's intrinsic height rather
     than sizing to its 15px icon */
  #headRight { grid-column: 3; justify-self: end; display: flex; align-items: stretch; gap: .4rem; }

  /* Must follow the two rules above: same specificity, so source order
     decides. Mobile portrait puts the title on its own row above the
     controls; the second query catches anything too narrow for one row
     whatever its orientation. */
  @media (max-width: 991.98px) and (orientation: portrait), (max-width: 699.98px) {
    .page-head { grid-template-columns: minmax(0, 1fr); }
    #pageTitle { grid-column: 1; grid-row: 1; }
    #headRight { grid-column: 1; grid-row: 2; justify-self: center; }
  }
  .thm-ico { width: 15px; height: 15px; display: block; }
  /* square: JS sets width from the rendered height, which is driven by
     the stretched row. min-width is the pre-script fallback. */
  #menuBtn, #themeBtn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    padding: 0;
    min-width: 2.25rem;
    flex: 0 0 auto;
  }

  /* ---- floating icon strip ---- */
  .strip-bar {
    background: var(--bar-bg);
    -webkit-backdrop-filter: blur(12px) saturate(140%);
    backdrop-filter: blur(12px) saturate(140%);
    border-bottom: 1px solid var(--hair);
    padding-top: max(.35rem, env(safe-area-inset-top));
    padding-bottom: .35rem;
  }
  #strip { display: flex; gap: 0; }
  .stage-btn {
    flex: 1 1 0;
    min-width: 0;
    background: transparent;
    border: 0;
    border-radius: .5rem;
    padding: .35rem .1rem .3rem;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    filter: grayscale(1);
    opacity: var(--dim-op);
    transition: opacity .25s ease, filter .25s ease, background-color .25s ease;
  }
  .stage-btn svg {
    display: block; margin: 0 auto;
    width: clamp(22px, 6.6vw, 46px); height: auto;
    /* scale rather than resize: the strip must not reflow as stages pass */
    transform: scale(.9);
    transition: transform .25s ease;
  }
  .stage-btn.active svg { transform: scale(1.1); }
  .stage-btn:hover, .stage-btn:focus-visible { opacity: .7; }
  .stage-btn.active {
    filter: none;
    opacity: 1;
    background: var(--active-tint);
    box-shadow: inset 0 0 0 1px var(--active-ring);
  }
  .stage-btn .lbl {
    display: block;
    margin-top: .2rem;
    font-size: clamp(.58rem, 1.5vw, .68rem);
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--strip-lbl);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .stage-btn.active .lbl { color: var(--gold); }
  .stage-btn.is-live::after {
    content: "";
    display: block;
    width: 14px; height: 2px;
    margin: .2rem auto 0;
    border-radius: 2px;
    background: var(--gold);
  }
  .lbl-abbr { display: none; }

  /* ---- site bar ---- */
  /* icon left, two data rows right; stretch siblings to its height */
  #siteBtn {
    --bs-btn-font-size: .72rem;
    --bs-btn-padding-y: .3rem;
    --bs-btn-padding-x: .5rem;
    text-align: left;
    white-space: nowrap;   /* width follows the widest row: no reflow */
    flex-shrink: 0;
  }
  #siteBtn .num { font-variant-numeric: tabular-nums; }
  .menu-ico { width: 17px; height: 17px; display: block; flex: 0 0 auto; }
  .info-ico { flex: 0 0 auto; line-height: 0; }
  .info-ico svg { width: 24px; height: 24px; display: block; opacity: 1; }
  /* topic titles: id + type beats the .h6 utility, which stays as a floor
     in case this rule ever fails to load */
  #infoModal h3 { font-size: 1.2rem; margin-top: 1.35rem; }
  #infoModal h3:first-of-type { margin-top: 0; }

  /* ---- slide-out menu ----
     Fixed position at z-index 1045, so it paints over the sticky strip
     bar (1020) instead of behind it, which is what sank the dropdown. */
  #menuPanel { width: min(20rem, 88vw); }
  #menuPanel .list-group-item {
    background: transparent;
    border-color: var(--hair);
    padding: .7rem 1rem;
  }
  /* pill-shaped segmented language switch */
  #langGroup .btn {
    --bs-btn-border-radius: 0;
    --bs-btn-padding-x: .6rem;
    font-variant-numeric: tabular-nums;
    letter-spacing: .03em;
  }
  #langGroup label:first-of-type {
    border-start-start-radius: 50rem; border-end-start-radius: 50rem;
    --bs-btn-padding-x: .75rem;
  }
  #langGroup label:last-of-type {
    border-start-end-radius: 50rem; border-end-end-radius: 50rem;
    --bs-btn-padding-x: .75rem;
  }

  /* the QR stays dark-on-white in both themes: inverted codes fail on
     some readers */
  .qr-panel {
    background: #fff;
    border-radius: .5rem;
    padding: .75rem;
    display: inline-block;
    line-height: 0;
  }
  .qr-panel svg { display: block; }
  /* 200px over 37 modules is 5.4 px each: comfortable for a phone camera */
  .qr { width: 200px; height: 200px; }
  .qr-url {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: .68rem;
    word-break: break-all;
    color: var(--cd-label);
  }
  #shareUrl { font-size: .8rem; }

  /* ---- about ---- */
  #aboutName { font-size: 1.6rem; }          /* h2 scale */
  /* one inline-block, not two: two of them flow side by side and the
     dialog splits into columns */
  .about-middle { margin-top: 2.25rem; }     /* large gap under the name */
  #creditsList li { line-height: 1.5; }
  #creditsList li + li { margin-top: .1rem; }
  .about-links { margin-top: 2.75rem; }      /* large gap above the links */
  .about-link {
    display: inline-flex; flex-direction: column; align-items: center; gap: .4rem;
    text-decoration: none; color: inherit;
  }
  .about-link:hover { color: var(--gold); }
  .about-ico svg { width: 34px; height: 34px; display: block; }
  .about-cap { font-size: .78rem; letter-spacing: .03em; }
  .globe { width: 21px; height: 21px; display: block; opacity: .85; }
  .glyph { width: 12px; height: 12px; flex: 0 0 auto; opacity: .8; }

  /* ---- countdown column ---- */
  #list { overflow: hidden; }
  .cd-row { padding: .3rem 0; border-top: 1px solid var(--hair); }
  .cd-row:first-child { border-top: 0; }
  .cd-label {
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--cd-label);
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cd-time {
    display: inline-block;
    color: var(--cd-dim);
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    letter-spacing: -.035em;
    line-height: 1.04;
    white-space: nowrap;
  }
  .cd-row.main .cd-label { color: var(--gold); }
  .cd-row.main .cd-time { color: var(--cd-main); text-shadow: var(--main-glow); }
  .cd-target { color: var(--cd-label); font-size: .7rem; }

  #previewBar { flex-wrap: wrap; gap: .35rem; }

  /* ---- map ---- */
  /* dark_all is muted by design; lift it before raising contrast, since
     contrast() pivots on mid grey and would otherwise crush dark tiles
     to black. Tweak this one line to taste. */
  :root { --map-filter: brightness(1.75) contrast(1.18) saturate(1.25); }
  #map.map-boost .leaflet-tile-pane { filter: var(--map-filter); }
  #map {
    height: min(42vh, 300px);
    min-height: 180px;
    border-radius: .5rem;
    background: var(--map-bg);
    z-index: 0;
  }
  .leaflet-container { background: var(--map-bg); }
  .sun-tbl { width: 100%; }
  .sun-tbl td { padding: .1rem .5rem .1rem 0; font-size: .8rem; }
  .sun-tbl td.num { font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }

  /* ---- observation spot dialog ---- */
  #siteModal .form-label { font-size: .75rem; line-height: 1.25; margin-bottom: .2rem; }
  /* iOS Safari zooms the whole page when a focused field is under 16px */
  @media (max-width: 767.98px) {
    #siteModal .form-control { font-size: 16px; }
  }

  /* ---- narrow screens: swap word labels for the list numbers ---- */
  @media (max-width: 767.98px) {
    .lbl-full { display: none; }
    .lbl-abbr { display: inline; }
  }

  /* ---- short viewports (phone landscape): give the digits the room ---- */
  @media (max-height: 560px) {
    .page-head { padding-top: .4rem; margin-bottom: .25rem; }
    .cd-target { display: none; }
    .cd-row { padding: .1rem 0; }
    .strip-bar { padding-top: max(.2rem, env(safe-area-inset-top)); padding-bottom: .2rem; }
    #map { height: 40vh; min-height: 150px; }

    /* full-bleed dialog: margins are wasted height at 390px tall */
    #siteModal .modal-dialog { width: 100vw; max-width: none; height: 100%; margin: 0; }
    #siteModal .modal-content { height: 100%; border: 0; border-radius: 0; }
    #siteModal .modal-header, #siteModal .modal-footer { padding-block: .25rem; }
    #siteModal hr.my-3 { margin-block: .6rem; }
  }

  /* landscape phone: put the map beside the form instead of above it */
  @media (min-width: 760px) and (max-height: 560px) {
    #modalGrid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 0 1.25rem;
      align-items: start;
    }
    #map { height: 52vh; min-height: 140px; }
    /* keep the time fields two-up: the column is half as wide now */
    #timesRow > [class*="col-"] { flex: 0 0 auto; width: 50%; }
  }

  @media (prefers-reduced-motion: reduce) {
    .stage-btn, .stage-btn svg { transition: none; }
  }
</style>
</head>
<body>

<!-- header: title centred, language + theme on the right -->
<header class="page page-head mb-2">
  <h1 id="pageTitle" class="h4 mb-0 text-center">Total solar eclipse stages - 08/12/2026</h1>
  <div id="headRight">
    <button id="siteBtn" type="button"
            class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-2"
            data-bs-toggle="modal" data-bs-target="#siteModal">
      <span id="siteGlobe" class="flex-shrink-0"></span>
      <span class="lh-sm">
        <span id="siteLat" class="d-block num"></span>
        <span id="siteLon" class="d-block num"></span>
        <span id="siteSun" class="d-flex align-items-center gap-1"></span>
      </span>
    </button>
    <button class="btn btn-sm btn-outline-secondary" type="button" id="menuBtn"
            data-bs-toggle="offcanvas" data-bs-target="#menuPanel" aria-controls="menuPanel">
      <span id="menuBtnIcon"></span>
    </button>
  </div>
</header>

<!-- floating stage icons -->
<div class="strip-bar sticky-top">
  <div class="page">
    <div id="strip"></div>
    <div id="progWrap" class="progress mt-1" style="height: 3px;" role="progressbar" aria-valuemin="0" aria-valuemax="100">
      <div id="prog" class="progress-bar bg-warning" style="width: 0%;"></div>
    </div>
  </div>
</div>

<main class="page pb-4">
  <!-- preview notice -->
  <div id="previewBar" class="alert alert-warning d-none align-items-center justify-content-between py-1 px-2 small mt-2 mb-2">
    <span><span id="pvPre"></span><strong id="pvName"></strong><span id="pvMid"></span><span id="pvSecs"></span><span id="pvSuf"></span></span>
    <button id="pvBack" type="button" class="btn btn-sm btn-outline-secondary py-0"></button>
  </div>

  <!-- countdowns -->
  <div id="list" class="d-flex flex-column mt-2"></div>

</main>

<!-- observation spot dialog -->
<div class="modal fade" id="siteModal" tabindex="-1" aria-labelledby="siteModalTitle" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable modal-fullscreen-sm-down">
    <div class="modal-content">
      <div class="modal-header py-2">
        <h2 class="modal-title h6 mb-0" id="siteModalTitle"></h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" id="closeX"></button>
      </div>
      <div class="modal-body">
       <div id="modalGrid">
        <div id="mapCol">
        <p id="mapHint" class="text-secondary small mb-2"></p>
        <div id="map"></div>
        <div id="mapFail" class="alert alert-secondary small mt-2 mb-0 d-none"></div>
        </div>

        <div id="formCol">
        <div class="row g-2 mt-2 align-items-end">
          <div class="col-6 col-sm-4">
            <label class="form-label small mb-1" for="latIn" id="latLbl"></label>
            <input type="text" inputmode="decimal" class="form-control form-control-sm" id="latIn">
          </div>
          <div class="col-6 col-sm-4">
            <label class="form-label small mb-1" for="lonIn" id="lonLbl"></label>
            <input type="text" inputmode="decimal" class="form-control form-control-sm" id="lonIn">
          </div>
          <div class="col-6 col-sm-4">
            <label class="form-label small mb-1" for="elevIn" id="elevLbl"></label>
            <input type="text" inputmode="decimal" class="form-control form-control-sm" id="elevIn">
          </div>
          <div class="col-6 col-sm-12">
            <button type="button" class="btn btn-sm btn-outline-secondary w-100" id="geoBtn"></button>
          </div>
        </div>
        <div id="coordErr" class="text-danger small mt-1 d-none"></div>

        <hr class="my-3">

        <h3 class="h6 mb-1" id="timesHead"></h3>
        <p id="srcNote" class="text-secondary small mb-2"></p>
        <div class="row g-2 align-items-end" id="timesRow">
          <div class="col-6 col-md-3">
            <label class="form-label small mb-1" for="c1In" id="c1Lbl"></label>
            <input type="text" inputmode="numeric" placeholder="HH:MM:SS" class="form-control form-control-sm" id="c1In">
          </div>
          <div class="col-6 col-md-3">
            <label class="form-label small mb-1" for="c2In" id="c2Lbl"></label>
            <input type="text" inputmode="numeric" placeholder="HH:MM:SS" class="form-control form-control-sm" id="c2In">
          </div>
          <div class="col-6 col-md-3">
            <label class="form-label small mb-1" for="c3In" id="c3Lbl"></label>
            <input type="text" inputmode="numeric" placeholder="HH:MM:SS" class="form-control form-control-sm" id="c3In">
          </div>
          <div class="col-6 col-md-3">
            <label class="form-label small mb-1" for="c4In" id="c4Lbl"></label>
            <input type="text" inputmode="numeric" placeholder="HH:MM:SS" class="form-control form-control-sm" id="c4In">
          </div>
        </div>
        <div id="timeErr" class="text-danger small mt-1 d-none"></div>
        <p id="derivedNote" class="text-secondary small mt-2 mb-0"></p>

        <hr class="my-3">

        <h3 class="h6 mb-2" id="sunHead"></h3>
        <div id="sunOut"></div>
        </div>
       </div>
      </div>
      <div class="modal-footer py-2">
        <button type="button" class="btn btn-sm btn-outline-secondary me-auto" id="resetBtn"></button>
        <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal" id="cancelBtn"></button>
        <button type="button" class="btn btn-sm btn-warning" id="saveBtn"></button>
      </div>
    </div>
  </div>
</div>

<!-- slide-out menu: direct child of body, so no transformed or filtered
     ancestor can become its containing block -->
<div class="offcanvas offcanvas-end" tabindex="-1" id="menuPanel" aria-labelledby="menuPanelTitle">
  <div class="offcanvas-header py-2">
    <h2 class="offcanvas-title h6 mb-0" id="menuPanelTitle"></h2>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" id="menuCloseX"></button>
  </div>
  <div class="offcanvas-body p-0 d-flex flex-column">

    <!-- row 1: language on the left, theme on the right -->
    <div class="d-flex align-items-stretch justify-content-between gap-2 px-3 py-3 border-bottom"
         style="border-color: var(--hair) !important;">
      <div class="btn-group btn-group-sm" role="group" id="langGroup">
        <input type="radio" class="btn-check" name="langpick" id="lang-ca" value="ca">
        <label class="btn btn-outline-secondary" for="lang-ca">CA</label>
        <input type="radio" class="btn-check" name="langpick" id="lang-es" value="es">
        <label class="btn btn-outline-secondary" for="lang-es">ES</label>
        <input type="radio" class="btn-check" name="langpick" id="lang-en" value="en">
        <label class="btn btn-outline-secondary" for="lang-en">EN</label>
        <input type="radio" class="btn-check" name="langpick" id="lang-fr" value="fr">
        <label class="btn btn-outline-secondary" for="lang-fr">FR</label>
      </div>
      <button class="btn btn-sm btn-outline-secondary" type="button" id="themeBtn">
        <span id="themeBtnIcon"></span>
      </button>
    </div>

    <!-- rows 2 to 5 -->
    <div class="list-group list-group-flush">
      <button type="button" class="list-group-item list-group-item-action d-flex align-items-center gap-3"
              data-modal="siteModal">
        <span class="mi-spot"></span><span class="mi-label"></span>
      </button>
      <button type="button" class="list-group-item list-group-item-action d-flex align-items-center gap-3"
              data-modal="shareModal">
        <span class="mi-share"></span><span class="mi-label"></span>
      </button>
      <button type="button" class="list-group-item list-group-item-action d-flex align-items-center gap-3"
              data-modal="infoModal">
        <span class="mi-info"></span><span class="mi-label"></span>
      </button>
      <button type="button" class="list-group-item list-group-item-action d-flex align-items-center gap-3"
              data-modal="aboutModal">
        <span class="mi-about"></span><span class="mi-label"></span>
      </button>
    </div>
  </div>
</div>

<!-- share -->
<div class="modal fade" id="shareModal" tabindex="-1" aria-labelledby="shareTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header py-2">
        <h2 class="modal-title h6 mb-0" id="shareTitle"></h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" id="shareCloseX"></button>
      </div>
      <div class="modal-body">
        <label class="form-label small mb-1" for="shareUrl" id="shareUrlLbl"></label>
        <div class="input-group input-group-sm mb-3">
          <input type="text" class="form-control" id="shareUrl" readonly>
          <button class="btn btn-warning" type="button" id="copyBtn"></button>
        </div>
        <div class="text-center">
          <!-- Static QR for the published page URL, version 4 (37x37 incl.
               a 2-module quiet zone), error correction M. Regenerate if the
               URL changes: it encodes PAGE_URL below, without any fragment. -->
          <div class="qr-panel">
            <svg class="qr" viewBox="0 0 37 37" xmlns="http://www.w3.org/2000/svg"

       HTTPS, and selecting the field is a sane fallback either way */
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(field.value).then(ok, function () { field.select(); });
    } else {
      field.select();
    }
  });

  langRadios.forEach(function (r) {
    r.addEventListener("change", function () { if (r.checked) setLang(r.value); });
  });

  /* ---------------------------- countdowns --------------------------- */
  var preview = null, previewUntil = 0;

  /* Bootstrap tooltips trigger on "hover focus", and a click leaves focus on
     the button, so the tooltip would stay up long after the preview ended.
     Dismiss it explicitly; hover and keyboard focus still work as normal. */
  function hideTip(el) {
    if (!window.bootstrap || !window.bootstrap.Tooltip) return;
    var tip = window.bootstrap.Tooltip.getInstance(el);
    if (tip) tip.hide();
  }

  strip.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-i]");
    if (!b) return;
    hideTip(b);
    preview = Number(b.dataset.i);
    previewUntil = Date.now() + PREVIEW_MS;
    render();
    rows[preview].el.scrollIntoView({ block: "nearest", behavior: "smooth" });
  });

  pvBack.addEventListener("click", function () { preview = null; render(); });

  /* the control row's height comes from the three-row spot button, so the
     square side is only known after layout */
  function squareBtns() {
    [menuBtn, themeBtn].forEach(function (b) {
      b.style.width = "";
      b.style.minWidth = "";
      var side = b.offsetHeight;
      if (side > 0) {
        b.style.width = side + "px";
        b.style.minWidth = side + "px";   /* beats the CSS floor */
      }
    });
  }

  function remeasure() {
    squareBtns();
    if (map && $("siteModal").classList.contains("show")) map.invalidateSize();
    sizeKey = "";
    render();
  }
  window.addEventListener("resize", remeasure);
  window.addEventListener("orientationchange", remeasure);
  if (window.visualViewport) window.visualViewport.addEventListener("resize", remeasure);

  function nextIndex(now) {
    for (var i = 0; i < T.length; i++) if (T[i] > now) return i;
    return T.length - 1;
  }

  function format(ms) {
    var sign = ms < 0 ? "+" : "";
    var s = Math.floor(Math.abs(ms) / 1000);
    var d = Math.floor(s / 86400);
    var h = Math.floor((s % 86400) / 3600);
    var m = Math.floor((s % 3600) / 60);
    return sign + (d > 0 ? d + t.dayUnit + " " : "") + pad(h) + ":" + pad(m) + ":" + pad(s % 60);
  }

  function applySizes(main) {
    var width = list.clientWidth;
    var top = list.offsetTop;
    var key = main + "|" + width + "|" + rows[main].time.textContent.length + "|" + top + "|" + window.innerHeight;
    if (key === sizeKey || width < 40) return;
    sizeKey = key;

    var probe = rows[main].time;
    probe.style.fontSize = "100px";
    var w = probe.getBoundingClientRect().width;
    var base = w > 0 ? (width * 0.98) / w * 100 : 48;

    /* soft ceiling so a very short window still shows more than one row;
       width normally wins, which is what landscape wants */
    var avail = Math.max(120, window.innerHeight - top - 8);
    base = Math.min(base, avail * 0.5);

    rows.forEach(function (r, i) {
      var factor = i === main ? 1
                 : i > main ? SCALES[Math.min(i - main, SCALES.length - 1)]
                 : PAST_SCALE;
      var fs = Math.max(MIN_FS, base * factor);
      r.time.style.fontSize = fs.toFixed(1) + "px";
      r.label.style.fontSize = Math.min(15, Math.max(9, fs * 0.17)).toFixed(1) + "px";
    });
  }

  function render() {
    var now = Date.now();
    var live = nextIndex(now);
    var main = live;

    if (preview !== null) {
      if (now < previewUntil) {
        main = preview;
        previewBar.classList.remove("d-none");
        previewBar.classList.add("d-flex");
        pvName.textContent = t.names[preview];
        pvSecs.textContent = Math.ceil((previewUntil - now) / 1000);
      } else {
        preview = null;
        previewBar.classList.add("d-none");
        previewBar.classList.remove("d-flex");
      }
    }

    buttons.forEach(function (b, i) {
      b.classList.toggle("active", i === main);
      b.classList.toggle("is-live", i === live && main !== live);
      b.setAttribute("aria-pressed", i === main ? "true" : "false");
    });

    var span = T[T.length - 1] - T[0];
    var pct = Math.min(100, Math.max(0, ((now - T[0]) / span) * 100));
    prog.style.width = pct.toFixed(2) + "%";
    progWrap.setAttribute("aria-valuenow", pct.toFixed(0));

    /* colour comes from CSS (theme aware); rank only drives opacity */
    rows.forEach(function (r, i) {
      var delta = T[i] - now;
      r.time.textContent = format(delta);
      r.el.classList.toggle("main", i === main);
      var op;
      if (i === main) op = 1;
      else if (delta <= 0) op = .45;
      else op = Math.max(.32, .82 - (i - main - 1) * 0.07);
      r.time.style.opacity = op;
      r.label.style.opacity = i === main ? 1 : Math.max(.45, op);
    });

    applySizes(main);
  }

  setLang(detectLang());
  applyTheme(HASH.th || "dark");
  applySite(site);
  setInterval(render, 250);
})();
</script>
</body>
</html>
